<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' app: 'unsafe-inline'; style-src 'self' app: 'unsafe-inline'; img-src app: data: blob:; font-src app: data:; connect-src app:">
<title>小鲸鱼</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    cursor: default;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #stage { position: absolute; inset: 0; }

  /* ── UI 层：默认整块不吃鼠标，需要点的元素单独放开 ── */
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 50; }

  /* 左上角竖排三颗圆钮（不压立绘：角色左边界约 x=100） */
  #btns {
    position: absolute; left: 6px; top: 46px; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; visibility: hidden; transition: opacity .16s ease;
  }
  #btns.on { opacity: 1; visibility: visible; }
  #btns button {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.85);
    background: rgba(255,255,255,.62); backdrop-filter: blur(6px);
    font-size: 13px; font-weight: 600; line-height: 1; cursor: pointer; padding: 0;
    font-family: inherit;
    color: #1f2937; opacity: .72; transition: transform .12s, opacity .12s, background .12s;
    pointer-events: auto; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  #btns button:hover { opacity: 1; transform: scale(1.12); background: rgba(255,255,255,.95); }

  /* 气泡：底边钉在角色头顶线上（y≈54），向上生长，最多两行 */
  #bubble {
    position: absolute; left: 50%; bottom: calc(100% - 54px); transform: translateX(-50%);
    max-width: 342px; padding: 7px 11px; border-radius: 12px;
    background: rgba(255,255,255,.94); color: #1f2937;
    font-size: 12.5px; line-height: 1.42; text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.16); border: 1px solid rgba(148,163,184,.35);
    display: none; pointer-events: none;
    overflow: hidden;
    word-break: break-word;
  }
  #bubble.on { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #bubble.thin { color: #64748b; font-style: italic; }

  /* 聊天框：和气泡同一个位置，打开时顶上去一点 */
  #chat {
    position: absolute; left: 50%; bottom: calc(100% - 104px); transform: translateX(-50%);
    width: 344px; padding: 8px; border-radius: 14px; display: none;
    background: rgba(255,255,255,.96); box-shadow: 0 4px 18px rgba(0,0,0,.22);
    border: 1px solid rgba(148,163,184,.4); gap: 6px; align-items: center;
  }
  #chat.on { display: flex; }
  #chat input {
    flex: 1; border: 1px solid #cbd5e1; border-radius: 9px; padding: 7px 9px;
    font-size: 13px; outline: none; font-family: inherit; background: #fff; color: #0f172a;
    pointer-events: auto; -webkit-user-select: text; user-select: text;
  }
  #chat input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
  #chat button {
    border: 0; border-radius: 9px; padding: 7px 13px; font-size: 13px; cursor: pointer;
    background: #2563eb; color: #fff; font-family: inherit; pointer-events: auto;
  }
  #chat button:hover { background: #1d4ed8; }
  #chat button:disabled { background: #94a3b8; cursor: default; }

  /* 右上角三个链路点 */
  #dots { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; opacity: .8; }
  #dots i {
    width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; display: block;
    box-shadow: 0 0 0 1px rgba(255,255,255,.7);
  }
  #dots i.ok { background: #22c55e; }
  #dots i.bad { background: #ef4444; }

  #err {
    position: absolute; left: 4px; bottom: 4px; right: 4px; color: #dc2626;
    font: 10px/1.3 Consolas, monospace; white-space: pre-wrap; pointer-events: none; z-index: 99;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <div id="dots" title="链路"><i data-k="sluma"></i><i data-k="web"></i><i data-k="bridge"></i></div>
  <div id="btns">
    <button data-a="chat" title="打字">打</button>
    <button data-a="pat" title="摸头">摸</button>
    <button data-a="play" title="去玩会儿">玩</button>
  </div>
  <div id="bubble"></div>
  <div id="chat">
    <input id="chatIn" maxlength="500" placeholder="跟她说句话…" autocomplete="off">
    <button id="chatSend">发</button>
  </div>
</div>
<div id="err"></div>
<script type="module">
const errEl = document.getElementById('err');
const DEBUGMODE = new URLSearchParams(location.search).has('debug');
const safe = (x) => { try { return JSON.stringify(x); } catch (_) { return String(x); } };
const say = (...a) => {
  const s = a.map((x) => (typeof x === 'string' ? x : safe(x))).join(' ');
  window.pet?.log(s);
  if (DEBUGMODE && errEl) errEl.textContent = s;
};
window.addEventListener('error', (e) => say('ERR', e.message || String(e)));
window.addEventListener('unhandledrejection', (e) => say('REJ', (e.reason && e.reason.message) || String(e.reason)));

import { createWhaleBody } from './whale/figure.js';
import { createRig, createBody } from './kit/body.js';

// ── 尺寸：由主进程给，必须是正方形（VIEW 280x280），否则 figure/body 两套坐标系对不上
let CFG = { size: 420, k: 420 / 280, floorY: 264 * (420 / 280), key: 'private:1946431105' };
try { CFG = { ...CFG, ...(await (window.pet?.config?.() ?? null) || {}) }; } catch (e) { say('config 失败', e.message); }
const W = CFG.size, H = CFG.size, S = CFG.k, FLOOR = CFG.floorY;

let api = null;
let state = { mood: '', affinity: null, doing: '', lastLine: '', lastLineAt: 0, links: {}, paused: null, activityAt: 0 };
let pendingUntil = 0;   // 发完话等回复的时间窗
let bubbleSticky = '';  // 临时气泡（发送回执等）
let bubbleTimer = 0;
/** 临时占住气泡 text 毫秒，到点恢复成她最近说的话 / 正在干嘛 */
function flashBubble(text, ms) {
  bubbleSticky = text || '';
  if (bubbleTimer) clearTimeout(bubbleTimer);
  renderBubble();
  bubbleTimer = setTimeout(() => { bubbleSticky = ''; bubbleTimer = 0; renderBubble(); }, ms || 4000);
}

// ── 命中区：只覆盖角色本体，窗口其余部分一律让鼠标穿过去
const CHAR_HALF = Math.min(112 * S, W * 0.44);
const HIT = {
  x0: W / 2 - CHAR_HALF,
  x1: W / 2 + CHAR_HALF,
  y0: Math.max(0, FLOOR * 0.24),
  y1: Math.min(H, FLOOR + 14),
};
const inBody = (x, y) => x >= HIT.x0 && x <= HIT.x1 && y >= HIT.y0 && y <= HIT.y1;

// ── UI 命中矩形：上报给主进程，让它把这几块从穿透里挖出来
const BTN_RECT = { x0: 2, y0: 42, x1: 46, y1: 168 };
const CHAT_RECT = { x0: 36, y0: 4, x1: 384, y1: 112 };
let hoverNear = false;
function pushUiRects() {
  const rects = [];
  if (hoverNear) rects.push(BTN_RECT);
  if (chat.classList.contains('on')) rects.push(CHAT_RECT);
  window.pet?.setUiRects(rects);
}

// ── 启动
async function boot() {
  const stage = document.getElementById('stage');
  const base = new URL('./whale/', location.href);

  api = await createWhaleBody(base, {
    kit: { createRig, createBody },
    // figure 在 createWhaleBody 里就已经按这个 scheme 建好了，host.start.skin 是给 body 自己用的
    scheme: (CFG.petState && CFG.petState.skin) || 'deepseek-maid',
    host: {
      root: stage,
      start: { skin: (CFG.petState && CFG.petState.skin) || 'deepseek-maid', x: 0, facing: 1 },
      bounds: () => ({ W, H, floorY: FLOOR, S }),
      emit: (kind, detail) => {
        window.pet?.emit(kind, detail ?? null);
        if (kind === 'touch' && detail) onTouch(detail);
      },
      sound: () => {},
    },
  });

  api.layout();
  say('ready | words=' + (api.words || []).length + ' | ' + W + 'x' + H + ' S=' + S.toFixed(3));

  let last = performance.now();
  const loop = (t) => {
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    try { api.step(dt); } catch (e) { say('step 崩', e.message); return; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.__petApi = api;
  window.pet?.emit('ready', { words: (api.words || []).length });
  pushUiRects();
  renderBubble();
}

// ── 气泡 ──
const bubble = document.getElementById('bubble');
const chat = document.getElementById('chat');
const chatIn = document.getElementById('chatIn');
const chatSend = document.getElementById('chatSend');
const dots = [...document.querySelectorAll('#dots i')];

// 气泡不常显：只有她刚说过话 / 在等她回 / 鼠标靠过来 才冒出来
const BUBBLE_FRESH_MS = 120 * 1000;

function mainLine() {
  const now = Date.now();
  if (pendingUntil > now) return { text: '（她想一下…）', thin: true };
  if (bubbleSticky) return { text: bubbleSticky, thin: false };
  if (state.lastLine && state.lastLineAt && now - state.lastLineAt < BUBBLE_FRESH_MS) {
    return { text: state.lastLine, thin: false };
  }
  if (hoverNear) {
    if (state.doing) return { text: state.doing, thin: true };
    if (state.lastLine) return { text: state.lastLine, thin: false };
  }
  return { text: '', thin: true };
}

function renderBubble() {
  const m = mainLine();
  if (!m.text) {
    if (bubble.classList.contains('on')) bubble.classList.remove('on');
    return;
  }
  if (bubble.textContent !== m.text) bubble.textContent = m.text;
  bubble.classList.toggle('thin', m.thin);
  bubble.classList.add('on');
}
// 让她说过的话到点自己收起来（2 分钟），不用等下一次状态推送
setInterval(renderBubble, 1000);

function renderDots() {
  for (const el of dots) {
    const v = state.links ? state.links[el.dataset.k] : null;
    el.classList.toggle('ok', v === true);
    el.classList.toggle('bad', v === false);
  }
}

function applyState(s) {
  const prevAt = state.lastLineAt || 0;
  const prevMood = state.mood, prevPaused = state.paused;
  state = { ...state, ...s };
  // 她回了新的 → 立刻撤掉「她想一下…」，别让占位干等 60 秒
  if (s.lastLineAt && s.lastLineAt > prevAt) pendingUntil = 0;
  renderBubble();
  renderDots();
  // 只在真的变了才做动作，否则每 2 秒推一次会把她按在床上反复睡
  try {
    if (s.paused === true && prevPaused !== true) api?.do('sleep');
    else if (s.mood === 'happy' && prevMood !== 'happy') api?.do('happy');
  } catch (_) {}
}

// ── 她的动作 ──
let seqTimer = null;
function playSeq(words) {
  clearTimeout(seqTimer);
  let i = 0;
  const step = () => {
    if (i >= words.length) return;
    try { api?.do(words[i]); } catch (e) { say('do 失败', words[i], e.message); }
    i++;
    seqTimer = setTimeout(step, 900);
  };
  step();
}

function onTouch(detail) {
  // body 内部的抓/放/甩事件：给点情绪反馈
  if (detail.kind === 'grab') { try { api.do('surprised'); } catch (_) {} }
  if (detail.kind === 'throw' || detail.kind === 'crash') { try { api.do('dizzy'); } catch (_) {} }
  if (detail.kind === 'drop') { try { api.do('happy'); } catch (_) {} }
}

// ── 聊天框 ──
function openChat() {
  chat.classList.add('on');
  if (bubble.textContent) bubble.classList.remove('on');
  chatIn.value = '';
  chatSend.disabled = false;
  pushUiRects();
  window.pet?.emit('chatOpen', true);
  setTimeout(() => chatIn.focus(), 30);
}
function closeChat() {
  if (!chat.classList.contains('on')) return;
  chat.classList.remove('on');
  pushUiRects();
  window.pet?.emit('chatOpen', false);
  renderBubble();
}
function toggleChat() { if (chat.classList.contains('on')) closeChat(); else openChat(); }

// 点聊天框以外的地方（窗口内）就收起来；窗口外靠主进程的 pet:ui{blur} 和窗口 blur
document.addEventListener('mousedown', (e) => {
  if (!chat.classList.contains('on')) return;
  if (e.target.closest && (e.target.closest('#chat') || e.target.closest('#btns'))) return;
  closeChat();
}, true);

async function sendChat() {
  const text = chatIn.value.trim();
  if (!text) return;
  chatSend.disabled = true;
  chatSend.textContent = '…';
  let r;
  try { r = await window.pet.send(text); } catch (e) { r = { ok: false, error: e.message }; }
  chatSend.disabled = false;
  chatSend.textContent = '发';
  if (r && r.ok) {
    chatIn.value = '';
    pendingUntil = Date.now() + 60000;
    closeChat();
    try { api.do('happy'); } catch (_) {}
  } else {
    bubbleSticky = '没送到：' + ((r && r.error) || '未知错误');
    bubble.classList.add('on', 'thin');
    bubble.textContent = bubbleSticky;
    setTimeout(() => { bubbleSticky = ''; renderBubble(); }, 4000);
  }
}

chatSend.addEventListener('click', sendChat);
chatIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
  if (e.key === 'Escape') { e.preventDefault(); closeChat(); }
});

// ── 三颗圆钮 ──
document.getElementById('btns').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'chat') { toggleChat(); return; }
  if (a === 'pat') {
    try { api.do('flustered'); } catch (_) {}
    bubbleSticky = '嘿嘿…别摸啦';
    bubble.textContent = bubbleSticky;
    bubble.classList.add('on');
    setTimeout(() => { bubbleSticky = ''; renderBubble(); }, 2600);
    return;
  }
  if (a === 'play') {
    bubbleSticky = '（她去刷手机了…）';
    bubble.textContent = bubbleSticky;
    bubble.classList.add('on');
    try { api.do('wave'); } catch (_) {}
    await window.pet.action('wake', 'interval');
    setTimeout(() => { bubbleSticky = ''; renderBubble(); }, 5000);
  }
});

// ── 主进程 → UI ──
window.pet?.onUi?.((m) => {
  if (!m) return;
  if (m.t === 'do') { try { api?.do(m.word); } catch (e) { say('do 失败', m.word); } }
  else if (m.t === 'seq') playSeq(m.words || []);
  else if (m.t === 'scheme') {
    try {
      Promise.resolve(api?.setScheme(m.id))
        .then(() => say('换样子', m.id))
        .catch((e) => say('换样子失败', m.id, e && e.message));
    } catch (e) { say('换样子失败', m.id); }
  }
  else if (m.t === 'chat') openChat();
  else if (m.t === 'blur') closeChat();
  else if (m.t === 'bubble') flashBubble(m.text, m.ms || 4000);
});

window.pet?.onState?.(applyState);

// 光标靠近窗口才让三颗纽扣浮出来（判定在主进程，渲染进程收不到穿透时的 mousemove）
const btnsEl = document.getElementById('btns');
window.pet?.onHover?.((near) => {
  hoverNear = near;
  btnsEl.classList.toggle('on', near);
  pushUiRects();
});

// ── 鼠标：穿透完全由主进程轮询决定（main.js startHitPolling，已并入 uiRects）。
//    抓着立绘走 = 搬整个窗口，屏幕上爱放哪放哪。
let down = false, moved = false, dragging = false, downX = 0, downY = 0;

window.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (!inBody(e.clientX, e.clientY)) return;
  e.preventDefault();
  down = true; moved = false; dragging = false;
  downX = e.clientX; downY = e.clientY;
});

// 只有真移动了才搬窗口；原地按一下算「戳她」
window.addEventListener('mousemove', (e) => {
  if (!down || dragging) return;
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 5) return;
  dragging = true; moved = true;
  window.pet?.winDragStart();
}, { passive: true });

function finishDrag() {
  if (!down) return;
  down = false;
  if (dragging) { dragging = false; window.pet?.winDragEnd(); }
  else if (!moved) {
    try { api.do(['happy', 'wink', 'love', 'shy'][Math.floor(Math.random() * 4)]); } catch (_) {}
  }
  moved = false;
}
window.addEventListener('mouseup', () => finishDrag());
window.addEventListener('pointercancel', () => finishDrag());
window.addEventListener('blur', () => { finishDrag(); closeChat(); });

window.addEventListener('dblclick', (e) => {
  if (inBody(e.clientX, e.clientY)) { e.preventDefault(); openChat(); }
});
document.addEventListener('contextmenu', (e) => { e.preventDefault(); window.pet?.action('menu'); });
document.addEventListener('dragstart', (e) => e.preventDefault());

boot().catch((e) => say('boot 崩', e.message || String(e)));
</script>
</body>
</html>
