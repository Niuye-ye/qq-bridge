<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>whale pet</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #err { position: absolute; left: 4px; top: 4px; right: 4px; color: #c00;
         font: 11px/1.35 Consolas, monospace; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<div id="dbg" style="position:fixed;left:2px;top:2px;font:10px monospace;color:#e11;z-index:99;pointer-events:none"></div>
<script>window.DEBUGMODE=new URLSearchParams(location.search).has('debug');</script>
<div id="stage"></div>
<div id="err"></div>
<script type="module">
const errEl = document.getElementById('dbg');
const say = (...a) => { console.log(...a); if (!window.DEBUGMODE || !errEl) return; errEl.textContent = a.join(' '); };
const post = (m) => { try { window.chrome && window.chrome.webview && window.chrome.webview.postMessage(m); } catch (_) {} };
window.addEventListener('error', (e) => say('ERR', e.message));
window.addEventListener('unhandledrejection', (e) => say('REJ', e.reason && e.reason.message || e.reason));

import { createWhaleBody } from './whale/figure.js';
import { createRig, createBody } from './kit/body.js';

let api = null;

async function boot(opts) {
  opts = opts || {};
  const stage = document.getElementById('stage');
  const base = new URL('./whale/', location.href);
  api = await createWhaleBody(base, {
    kit: { createRig, createBody },
    host: {
      root: stage,
      start: { skin: opts.skin || 'deepseek-maid', x: 0, facing: 1 },
      // body.js 的契约：返回 { W, H, floorY, S }（舞台像素）
      bounds: () => {
        const W = stage.clientWidth || 300;
        const H = stage.clientHeight || 420;
        const S = (H * (opts.fill || 0.62)) / 256;
        return { W, H, floorY: H - 6, S };
      },
      emit: (kind, detail) => post({ type: 'event', kind, detail }),
      sound: () => {},
    },
  });
  try { api.layout(); } catch (e) { say('layout: ' + e.message); }
  let last = performance.now();
  const loop = (t) => {
    const dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    try { api.step(dt); } catch (e) { say('step: ' + e.message); return; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.__petApi = api;
  post({ type: 'ready', words: api.words || [] });
  say('ready | words=' + (api.words || []).length);

  // 调试用：?do=happy / ?walk=80&run=1 / ?set=thinking&delay=200
  const q = new URLSearchParams(location.search);
  const delay = Number(q.get('delay') || 300);
  if (q.get('do')) setTimeout(() => window.__pet.do(q.get('do')), delay);
  if (q.get('walk')) setTimeout(() => window.__pet.walk(Number(q.get('walk')), q.get('run') === '1'), delay);
  if (q.get('set')) setTimeout(() => { const o = {}; o[q.get('set')] = true; window.__pet.set(o); }, delay);
  if (q.get('skin')) setTimeout(() => window.__pet.set({ skin: q.get('skin') }), delay);
}

window.__pet = {
  boot,
  do: (w) => { try { api.do(w); } catch (e) { say('do: ' + e.message); } },
  set: (s) => { try { api.set(s); } catch (e) { say('set: ' + e.message); } },
  walk: (x, run) => { try { api.walk(x, run, 'w'); } catch (e) { say('walk: ' + e.message); } },
  place: (x, f) => { try { api.place(x, f); } catch (e) { say('place: ' + e.message); } },
  pointer: (t, p) => { try { api.pointer(t, p); } catch (e) { say('pointer: ' + e.message); } },
  drop: (x) => { try { api.drop(x); } catch (e) { say('drop: ' + e.message); } },
};

boot();
</script>
</body>
</html>
